name: CI

# Jalan otomatis tiap push ke main & tiap Pull Request.
# Mengecek: unit test (logika skor) → typecheck → build. Kalau ada yang gagal,
# tab "Actions" / cek PR jadi merah dan pengirim diberi tahu.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit test (logika skor)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Nilai dummy — env Supabase hanya dibaca saat runtime, bukan saat build.
          # Rahasia asli ada di Vercel, TIDAK di repo.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-key-for-build
